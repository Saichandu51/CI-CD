name: Flask App CI

on:
  push:
    branches:
      - main  # or 'master' depending on your branch name

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run basic lint check (optional)
      run: |
        echo "Running lint..."
        python -m py_compile app.py

    - name: Save CI status
      run: |
        mkdir -p data
        echo '{
          "status": "success",
          "timestamp": "'$(date -u +'%Y-%m-%d %H:%M')'",
          "message": "Build passed on $GITHUB_REF"
        }' > data/ci_status.json

    - name: Upload CI status artifact
      uses: actions/upload-artifact@v4
      with:
        name: ci-status
        path: data/ci_status.json
